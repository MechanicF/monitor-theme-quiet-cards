[hidden]{display:none!important}
/* 清晰的分组卡片与轻量指标框 */

.network-stat::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:#75ae8d}

.network-label{display:block;margin-left:4px;color:var(--muted);font-size:10px}

.traffic-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:13px}
.traffic-title{display:flex;align-items:center;gap:9px;margin:0;color:#34483c;font-size:13px;font-weight:700}
.traffic-title::before{content:"";width:24px;height:24px;border-radius:8px;background:#e6f3eb;box-shadow:inset 0 0 0 1px #d7eadc}
.traffic-subtitle{margin:3px 0 0 33px;color:var(--muted);font-size:10px}
.traffic-pill{flex:none;padding:5px 9px;border:1px solid #e2ebe5;border-radius:999px;background:#fff;color:#617169;font-size:10px;font-weight:650}
.traffic-values{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:10px}
.traffic-used-label{display:block;color:var(--muted);font-size:10px}
.traffic-used{display:block;margin-top:2px;font-size:22px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.traffic-quota{text-align:right;color:#506258;font-size:11px;font-weight:650;overflow-wrap:anywhere}
.traffic-track{height:9px;overflow:hidden;border:1px solid #e5ece7;border-radius:999px;background:#edf2ee}
.traffic-track span{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#53a477,#177a58);transition:width .4s}
.traffic-track.warn span{background:linear-gradient(90deg,#e2ad4a,#b87a16)}
.traffic-track.danger span{background:linear-gradient(90deg,#df8585,#c44d4d)}

<body>
<div class="page">
  <header class="topbar"><div class="brand"><span class="brand-mark">M</span><span>MONITOR <span class="brand-sub">/ STATUS</span></span></div><div class="live-state" id="live-state"><span class="live-dot"></span><span id="live-label">正在连接</span></div></header>
  <main>
   <div id="home-screen">
    <section class="hero"><div><h1 id="site-name">Monitor 状态</h1><p id="subtitle">节点状态与运行数据</p></div><div class="hero-meta" id="updated-at">等待数据</div></section>
    <div id="demo-note" hidden></div><div class="notice" id="notice" hidden></div>
    <section class="summary" id="summary" aria-label="状态概览"></section>
    <section class="filters"><div class="group-list" id="groups" aria-label="按分组筛选"></div><label class="sr-only" for="search">搜索节点</label><input id="search" class="search" type="search" placeholder="搜索节点名称、系统或地区" autocomplete="off"></section>
    <div class="section-head"><span id="list-title">节点</span><span id="list-count"></span></div>
    <section class="cards" id="cards"><div class="loading">正在读取公开状态…</div></section>
    <section class="traffic-summary" id="traffic-summary" aria-label="总流量统计"></section>
   </div>
    <section class="detail-screen" id="detail-screen" hidden></section>
  </main>
  <footer class="foot"><span>简洁呈现 · 数据来自 Monitor 公开 API</span><span>公开数据不含地址、主机名、私有备注或节点凭证</span></footer>
</div>
<script>
(() => {
  'use strict';
  const SHORT = 'quiet-cards';
  const $ = (id) => document.getElementById(id);
  const state = { nodes: [], me: {}, config: { notice: '', show_history: true }, filter: null, search: '', selectedNodeId: new URLSearchParams(location.search).get('node'), historyDays: 30, hours: [], updated: null, demo: false, socket: null, poll: null, retry: null, inFlight: 0, paused: false };
  const historyCache = new Map();
  const historyOpen = new Set();
  const selectedHours = new Map();
  const escText = (value) => value == null ? '' : String(value);
  const el = (tag, cls, text) => { const node = document.createElement(tag); if (cls) node.className = cls; if (text !== undefined && text !== null) node.textContent = String(text); return node; };
  const add = (parent, child) => { if (child) parent.appendChild(child); return child; };
  const num = (v) => typeof v === 'number' && Number.isFinite(v) ? v : null;
